name: Batch 2 validation

on:
  pull_request:
    branches:
      - checkpoint/batch-1-complete-2026-11-03
    paths:
      - "live_demo_v2/**"
      - "research/prototype/src/verifier.py"
      - "research/prototype/tests/test_verifier_input_length.py"
      - ".github/workflows/batch2-validation.yml"
  push:
    branches:
      - fix/batch-2-reliability

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live_demo_v2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: live_demo_v2/web/package-lock.json
      # The checked-in lockfile predates the declared lucide-react dependency.
      # npm install reconciles it on the runner before running the checks.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  python-static-and-length-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile changed Python modules
        run: python -m compileall -q live_demo_v2/server research/prototype/src/verifier.py
      - name: Test fail-closed NLI sequence length
        env:
          PYTHONPATH: research/prototype
        run: python -m pytest research/prototype/tests/test_verifier_input_length.py -q
