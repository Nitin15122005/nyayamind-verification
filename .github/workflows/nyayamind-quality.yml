name: NyayaMind quality gates

on:
  push:
    branches:
      - publication/readiness-engineering
  pull_request:
    branches:
      - main
      - publication/readiness-engineering
  workflow_dispatch:
    inputs:
      run_model_integration:
        description: Run real DeBERTa integration tests (downloads model weights)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nyayamind-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 3.11 — prototype tests and evidence integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML rank_bm25
          python -m pip install "numpy==1.26.4"
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.40.2" "sentencepiece==0.2.2"
      - name: Compile Python source and scripts
        run: |
          python -m compileall -q research/prototype/src
          python -m compileall -q research/prototype/scripts
      - name: Run deterministic prototype test suite
        env:
          PYTHONPATH: research/prototype
        run: python -m pytest research/prototype/tests -m 'not integration' -ra
      - name: Audit statutory evidence structure (read-only)
        run: |
          python research/prototype/scripts/audit_evidence_integrity.py \
            --output "${{ runner.temp }}/evidence-integrity-audit.json"


  real-model-integration:
    name: Real DeBERTa model integration (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_model_integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install CPU model integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" PyYAML pytest
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.40.2" "sentencepiece==0.2.2"
      - name: Run real-model integration tests
        env:
          PYTHONPATH: research/prototype
          HF_HOME: ${{ runner.temp }}/huggingface
        run: python -m pytest research/prototype/tests/test_correction_path_real_integration.py -m integration -v -ra

  frontend:
    name: Web — tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: live_demo_v2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: live_demo_v2/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  python-server:
    name: Server — syntax and test discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server test dependency
        run: python -m pip install PyYAML
      - name: Compile server
        run: python -m compileall -q live_demo_v2/server
      - name: Discover server tests
        run: python -m unittest discover -s live_demo_v2/server/tests -v
