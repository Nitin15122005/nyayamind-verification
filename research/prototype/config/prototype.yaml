# Prototype v0 configuration — field-level statutory-claim verification +
# selective correction. See research/prototype/README.md for the full
# design this implements.
#
# Nothing in this file is a validated/tuned value except where noted "fixed
# by design" — thresholds and generation params are the v0 defaults from
# the approved design doc, not results of any calibration run.

seed: 42

paths:
  # Evidence files are READ-ONLY inputs. Never write to these.
  canonical_statutes: "research/data/evidence/canonical_statutes.jsonl"
  evidence_audit: "research/data/evidence/evidence_audit.jsonl"

  # v1 evidence supplement (82 records: 3 corrections to known v0
  # INVALID/UNRESOLVED/wrong-historical_status records, 79 genuinely new
  # citations — ranked #64-143 by real NyayaRAG corpus citation frequency;
  # see research/data/evidence/README_v1.md and
  # scripts/build_evidence_v1.py). Loaded ONLY when `use_evidence_v1: true`
  # below (default false) — omitting it, or leaving it false, reproduces
  # v0-only behaviour exactly, byte-for-byte, for every existing committed
  # output. Also READ-ONLY.
  canonical_statutes_v1: "research/data/evidence/canonical_statutes_v1.jsonl"
  evidence_audit_v1: "research/data/evidence/evidence_audit_v1.jsonl"

  # NyayaRAG CaseText_Statutes data (L-NLProc/NyayaRAG on Hugging Face,
  # 3.CaseText_Statutes.zip), copied from an earlier session's scratch
  # extraction into this stable, project-relative location. See README
  # "Known limitations / data provenance" for details.
  nyayarag_case_files:
    - "research/data/nyayarag/CaseText_Statutes/SCI_56k_multi_5k_summarised_w_sections.json"
    - "research/data/nyayarag/CaseText_Statutes/SCI_56k_single_5k_summarised_w_sections.json"

  output_dir: "research/prototype/outputs"

# Which evidence_audit.jsonl verdicts are trusted as usable evidence.
# SOURCE_ONLY / INVALID / UNRESOLVED are excluded by design (see audit
# README) — they are not "gold" and must not be used as verifier premises.
usable_evidence_verdicts:
  - "VERIFIED_EXACT"
  - "VERIFIED_CONTENT"

# Opt-in, DEFAULT CHANGED TO "true" 2026-08-27 (was "false"). Also loads and
# merges canonical_statutes_v1.jsonl + evidence_audit_v1.jsonl on top of the
# base v0 corpus (src/data_loader.py, load_usable_evidence's
# extra_canonical_path/extra_audit_path). Expands the usable evidence pool
# from 59 to 136 records (78 new VERIFIED_EXACT + the 59 v0 records, with 3
# v0 corrections applied) — see research/data/evidence/README_v1.md for the
# full build methodology and outputs/evidence_v1_independent_audit.md for
# the 2026-08-27 independent audit (50% of v1's 82 records directly
# re-fetched and content-verified, vs. the original build's 10%; 2 genuine
# defects found and fixed; 0 fabricated/wrong-provision content found) and
# outputs/final_gpu_validation.md for the paired-arms GPU experiment this
# decision is based on (McNemar chi2=13.07, p≈0.0003, +7.1pp evidence
# coverage on 50 held-out natural cases never seen by evidence_v1's own
# construction, zero regressions). See FINAL_PRODUCTION_CONFIG.md for the
# full decision record. Every evaluation output committed BEFORE 2026-08-27
# was produced against the v0-only 59-record pool with this flag false —
# set it back to false to exactly reproduce that historical behaviour.
use_evidence_v1: true

generation:
  model_id: "Qwen/Qwen2.5-7B-Instruct"
  quantization:
    load_in_4bit: true
    bnb_4bit_use_double_quant: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "bfloat16"
  device_map: {"": 0}
  max_new_tokens: 200
  do_sample: false          # greedy — deterministic given fixed seed/model
  temperature: 1.0          # inert under do_sample=false; recorded for completeness
  top_p: 1.0                # inert under do_sample=false; recorded for completeness
  # Instructs the model to emit ONLY the statutory_grounding field — no
  # issue/argument/decision/explanation fields, no preamble, no markdown.
  system_prompt: >
    You are drafting only the "Statutory Grounding" section of an Indian
    court judgment summary. Given the case facts, write ONE short paragraph
    (3-6 sentences) naming the specific statutes, sections, or articles that
    apply to this case and briefly stating what each one requires. Output
    ONLY that paragraph. Do not include an issue, arguments, decision, or
    explanation. Do not use markdown or headings.
  user_prompt_template: "Case facts:\n{case_text}\n\nStatutory Grounding:"

claim_parsing:
  # INFORMATIONAL ONLY — not read at runtime. The authoritative,
  # unit-tested pattern (plus the act-name trimming heuristics it needs;
  # see _trim_act_name() in src/claim_parser.py) lives in code, not YAML,
  # to avoid YAML-escaping drift between this string and what actually
  # runs. Shown here so the pattern is visible without opening the source.
  citation_regex: '(Section|Article|Order|Rule|Regulation|Clause|Schedule)\s+(\d+[A-Za-z\-]*)(\s*\(([^)]+)\))?\s+(in|of)\s+(.+?)(?=[.;]|$)'
  stopwords: ["the", "of", "and", "in", "for", "to", "a", "an", "this", "that", "act", "constitution", "india"]

evidence_matching:
  top_k: 1
  fuzzy_token_overlap_threshold: 0.8   # fixed by design, not calibrated

  # EVALUATED AND REJECTED as the default -- alternative act-name
  # similarity scoring for the fuzzy fallback step (src/retrieval_signals.py).
  # Motivation: the corpus's 22 unique Act names mean Jaccard token overlap
  # occasionally rejects legitimate shorthand act-name variants (e.g.
  # "Evidence Act" for "Indian Evidence Act", "Corruption Act" for
  # "Prevention of Corruption Act") that drop a qualifying word Jaccard
  # weighs equally with the head noun -- bm25/embedding DO fix that (100%
  # correct-accept on this project's 21 pre-registered should-match cases,
  # vs jaccard's 90.5%).
  #
  # RESULT (see outputs/retrieval_signal_benchmark_report.md for the full
  # threshold sweep this summarizes): both are measurably LESS SAFE than
  # jaccard on this corpus's confusable-Act-name pairs (e.g. Code of Civil
  # vs Criminal Procedure; Arbitration Act, 1940 vs Arbitration and
  # Conciliation Act, 1996; Income Tax Act vs Income Tax Rules). jaccard is
  # the ONLY method reaching 100% correct-reject (zero wrong-Act matches)
  # at any threshold tested. bm25 never reaches 100% correct-reject at any
  # threshold (best: 7/9, giving up correct-accept too). embedding CAN
  # reach 100% correct-reject, but only at threshold>=0.8, where its
  # correct-accept rate (76%) is already worse than jaccard's 90.5% at full
  # safety -- i.e. jaccard Pareto-dominates both alternatives on this
  # corpus. Root cause: bm25's term-frequency weighting under-penalizes a
  # query missing an Act's single distinguishing word the way Jaccard's
  # set-union normalization does; embedding actively rewards TRUE semantic/
  # topical similarity between Acts that are legally distinct enactments,
  # which is exactly backwards for citation-identity matching.
  #
  # DEFAULT REMAINS "jaccard". Kept available (not deleted) for future
  # corpora where this measured trade-off might differ -- re-run
  # scripts/benchmark_retrieval_signals.py before ever changing this
  # default, never assume the tradeoff has changed.
  fuzzy_method: "jaccard"              # jaccard (default) | bm25 | embedding
  fuzzy_bm25_threshold: 0.5            # min-max normalized within each candidate set
  fuzzy_embedding_threshold: 0.55      # raw cosine similarity
  embedding_model_id: "sentence-transformers/all-MiniLM-L6-v2"

verification:
  model_id: "MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli"
  # UNCHANGED 2026-08-27 review: outputs/threshold_sensitivity_analysis.md's
  # deterministic sweep (0.50-0.95) over the 420-item controlled benchmark
  # shows 0.70 sits within 0.002 macro-F1 of the empirical optimum under
  # BOTH bare (peak 0.751 @0.55-0.65, 0.70 gives 0.749) and labeled (peak
  # 0.968 @0.65-0.75, 0.70 gives 0.968 -- inside the plateau) framing. No
  # evidence supports moving it. See FINAL_PRODUCTION_CONFIG.md.
  confidence_threshold: 0.70           # fixed by design (approved design doc), not calibrated
  # This model's label order (id2label) is read from its own config at load
  # time rather than hardcoded here — see src/verifier.py.
  max_sequence_length: 512

  # How the NLI premise is built from a matched canonical evidence record.
  #
  #   bare    — premise is the statute text alone. This is what produced every
  #             committed result in outputs/ (run_A/B/C_n30, run_natural_targeted,
  #             run_synthetic_stress).
  #   labeled — premise is "<Provision> <N> of <Act>: <statute text>", i.e. the
  #             provision label the audited evidence record already carries is
  #             prepended. No statute text is edited and no legal content is
  #             invented.
  #
  # Why this option exists: generated claims are almost always attributed
  # ("According to Section 302 of the IPC, ..."), and a bare premise never
  # mentions Section 302, so that half of the claim is genuinely unsupported and
  # the model correctly answers neutral. On the 420-item controlled benchmark,
  # switching to "labeled" moves macro F1 0.749 -> 0.968 and ENTAILED recall
  # 0.500 -> 1.000 with no per-condition regression
  # (see outputs/verifier_correction_diagnosis.md).
  #
  # DEFAULT CHANGED TO "labeled" 2026-08-27 (was "bare"). Now validated on
  # the real production path end-to-end, on real natural NyayaRAG data, with
  # the full improved config (use_evidence_v1 + atomic_scope_check=
  # assertion_spans + narrow_reverification_hypothesis) and genuine Qwen
  # correction calls -- not just the controlled benchmark above. Three
  # convergent, non-synthetic lines of evidence (see
  # FINAL_PRODUCTION_CONFIG.md for the full record):
  #   1. Controlled benchmark (above): macro F1 0.749 -> 0.968.
  #   2. CPU-only re-verification of the final_gpu_validation batch's 147
  #      matched claims under labeled: ENTAILED 0 -> 13, more decisive
  #      verdicts throughout (outputs/final_validation_bare_vs_labeled_cpu_metrics.json).
  #   3. Real, targeted GPU correction validation on the same batch: labeled
  #      framing shipped 1 genuine, safe, substantively-correct correction
  #      (0.995 ENTAILED, 0 sibling regressions) -- the first ever shipped
  #      correction on a "final validation"-caliber held-out natural batch
  #      in this project's history. Bare framing, same cases, same improved
  #      config: 0 shipped (outputs/labeled_correction_validation_gpu_metrics.json).
  # Caveat, stated honestly: (3) is n=1 shipped / 10 triggered -- a small
  # sample. This is the newest and least-repeated of this config's changes;
  # see FINAL_PRODUCTION_CONFIG.md for the recommended follow-up validation
  # (a larger fresh batch) before treating this as fully settled. 0 unsafe
  # shipments observed in any test to date under any framing.
  # Every evaluation output committed BEFORE 2026-08-27 (run_A/B/C_n30,
  # run_natural_targeted, run_synthetic_stress, natural_candidates_50_gpu,
  # natural_candidates_batch2_gpu, and Arm A of final_gpu_validation) was
  # produced under "bare" -- set this back to "bare" to exactly reproduce
  # that historical behaviour.
  premise_framing: "labeled"      # bare | labeled

  # DEFAULT CHANGED TO true 2026-09-09. When True, the PRIMARY verification
  # pass (not just correction re-verification, which already has its own
  # equivalent correction.narrow_reverification_hypothesis flag) uses a
  # claim's narrower `assertion_text` as the NLI hypothesis instead of the
  # full `claim_text`, whenever one is available. This closes a documented,
  # evidence-backed gap named in outputs/final_limitations_and_future_scope.md
  # §3a: "the primary verification pass never uses the narrower
  # assertion_text hypothesis" -- on real NyayaRAG data one physical
  # sentence routinely backs multiple bundled claims, and verifying the
  # full sentence dilutes the hypothesis with sibling citations' unrelated
  # content. Never widens what counts as evidence-consistent --
  # assertion_text is always a genuine substring of the model's own
  # generated text, never synthesized.
  #
  # Evidence (see outputs/narrow_primary_hypothesis_benchmark_report.md,
  # scripts/benchmark_narrow_primary_hypothesis.py): CPU-only re-scoring of
  # every real evidence-matched claim already committed under outputs/
  # (456 unique (claim_text, evidence_id) pairs, no fresh generation) under
  # the current production labeled framing, comparing full claim_text vs.
  # assertion_text as hypothesis:
  #   - 107/456 (23.5%) claims have an actually-narrower assertion_text.
  #   - Of those, 31 flip NOT_ENOUGH_INFORMATION -> ENTAILED (a real
  #     coverage recovery -- manually inspected, every one is a genuine,
  #     faithful, verbatim isolation of one citation's own clause from a
  #     bundled multi-citation sentence, e.g. "Section 323 IPC pertains to
  #     voluntarily causing hurt" correctly isolated from a 4-citation
  #     bundle -- NOT the "shallow"/spurious-entailment pattern the
  #     2026-08-26 diagnosis (outputs/verifier_correction_diagnosis.md §6)
  #     warned labeled framing alone could produce on bundled sentences).
  #   - 2/456 flip NEI -> CONTRADICTED (new, legitimate correction triggers).
  #   - 0/456 safety-relevant reversals (ENTAILED<->CONTRADICTED) anywhere.
  # Set to false to reproduce every evaluation output committed before
  # 2026-09-09.
  narrow_primary_hypothesis: true

  # EXPERIMENTAL, OFF BY DEFAULT (added 2026-09-11) -- see
  # outputs/assertion_spans_primary_hypothesis_benchmark_report.md for the
  # measured comparison this default is based on. Extends
  # narrow_primary_hypothesis above to "respectively" claims (see
  # claim_parser.py's _assign_respectively_spans), the one case
  # assertion_text alone cannot narrow -- assertion_text stays equal to the
  # full claim_text for these by construction, since the split mechanism is
  # a LIST of 2 independently-required verbatim fragments
  # (assertion_spans = [bare_number_span, description_item]), not one
  # contiguous clause. Only takes effect when narrow_primary_hypothesis is
  # also true and assertion_text did not already narrow the claim. Builds
  # the hypothesis as "<provision_type> <provision_number> <description>"
  # (e.g. "Section 302 murder") -- see pipeline.py's
  # _assertion_spans_hypothesis() docstring for exactly why every word is a
  # genuine, non-fabricated substring, never synthesized.
  assertion_span_primary_hypothesis: false

correction:
  max_attempts: 1
  max_reverifications: 1
  model_id: "Qwen/Qwen2.5-7B-Instruct"   # reuses the generation model; no second model loaded
  max_new_tokens: 220
  do_sample: false
  system_prompt: >
    You are revising one sentence in the "Statutory Grounding" section of
    an Indian court judgment summary. You will be given only the flagged
    sentence and, if available, the actual text of the relevant statute.
    Rewrite ONLY the flagged sentence so it is consistent with the statute
    text. Return ONLY the corrected sentence, not the paragraph. Preserve the
    sentence's subject, scope, conditions, citation identity, and grammatical
    role; change only the unsupported or contradicted legal fact. Do not copy
    any neighboring sentence or fragment. Do not add a citation, section
    number, Act name, or fact that is not needed to correct this sentence.
    Output exactly ONE complete grammatical sentence and nothing else.

  # How the selective-correction SCOPE-VIOLATION check decides whether an
  # unflagged claim survived a correction intact (src/pipeline.py,
  # _scope_violation()).
  #
  #   false — (DEFAULT) legacy behaviour: every unflagged claim's full
  #           `claim_text` (the whole original sentence) must reappear
  #           byte-for-byte in the corrected text. This is what produced
  #           every committed result in outputs/.
  #   true  — atomic: an unflagged claim is checked against its own
  #           `assertion_text` instead — a conservative, VERBATIM,
  #           per-citation sub-span of `claim_text` (claim_parser.py's
  #           `_assign_assertion_texts`) that narrows to just this claim's
  #           own clause/gloss when a safe split pattern is found (a
  #           semicolon-delimited clause, a "while"-delimited clause, or a
  #           "<number> (<short gloss>)" parenthetical), and falls back to
  #           the FULL sentence — identical to legacy — whenever no safe
  #           split applies. Nothing is ever synthesized; every
  #           `assertion_text` is a contiguous substring of the model's
  #           own generated text.
  #   "assertion_spans" — structured: an unflagged claim is checked
  #           against `assertion_spans`, a LIST of independently-required
  #           VERBATIM fragments (claim_parser.py's
  #           `_assign_respectively_spans`) — ALL must survive, not just
  #           one. Exists specifically for the "respectively" pattern
  #           ("Sections 406 and 420 ..., which respectively deal with X
  #           and Y"), where a citation's relevant content is NOT one
  #           contiguous span (its own provision number sits in one place,
  #           its paired description elsewhere) — representing that as a
  #           single assertion_text would require either dragging in
  #           unrelated sibling content or SYNTHESIZING a combined
  #           sentence, which this codebase never does anywhere. For every
  #           claim NOT produced by a "respectively" sentence,
  #           `assertion_spans` is just `[assertion_text]` (a
  #           one-fragment list), so the check degrades to exactly the
  #           `true` behaviour above for those claims automatically.
  #
  # Why this option exists: on real NyayaRAG output, one physical sentence
  # routinely backs MULTIPLE claim records (a single sentence citing
  # several sections becomes one claim per citation, all sharing that
  # sentence as claim_text — see claim_parser.extract_claims()'s own
  # docstring). Under the legacy rule, editing ANY part of that shared
  # sentence — even a part confined to the flagged citation's own portion
  # — breaks every OTHER claim's byte-for-byte check, so a substantively
  # correct, narrowly-scoped edit is rejected as a scope violation purely
  # because of how many claims happen to share its sentence. Confirmed
  # against real correction attempts in
  # outputs/natural_candidates_50_gpu_corrections_detail.jsonl: 4 of 6
  # genuine (non-no-op) edits blocked as scope violations were
  # substantively valid fixes (e.g. a wrong provision number corrected),
  # not the corrector touching unrelated content.
  #
  # DEFAULT CHANGED TO "assertion_spans" 2026-08-27 (was "false"). Measured
  # safe on every real natural-data case tested to date: the independent
  # sibling-regression safety net (below) exists specifically to cover the
  # gap this relaxed check opens, and 0 unsafe corrections have ever shipped
  # under it, across every natural GPU experiment in this project including
  # the paired-arms final_gpu_validation run (0/10 unsafe) and the targeted
  # labeled-framing correction validation (see
  # outputs/labeled_correction_validation_gpu_metrics.json). See
  # FINAL_PRODUCTION_CONFIG.md for the full decision record, including the
  # honest caveat that this specific batch's 2 scope-violation cases were
  # NOT unlocked by the narrower check (both remained correctly rejected
  # under assertion_spans too) — the earlier batch-1 finding motivating this
  # default (4/6 genuine edits blocked by the legacy check) is what this
  # default is based on, not a repeat of that exact result in every run.
  # Set to "false" to exactly reproduce every evaluation output committed
  # before 2026-08-27.
  atomic_scope_check: "assertion_spans"

  # Opt-in (default false): when re-verifying a correction, use the
  # re-extracted replacement claim's own `assertion_text` (a verbatim,
  # non-fabricated per-citation clause/gloss) as the NLI hypothesis instead
  # of the full bundled sentence, whenever a narrower one was found. On a
  # bundled multi-citation sentence, verifying the FULL sentence dilutes
  # the hypothesis with sibling citations' unrelated content, which can
  # keep a genuinely correct, narrowly-targeted fix from reaching ENTAILED
  # even though it is accurate against its own evidence — measured
  # directly on a real case: 0.54 NOT_ENOUGH_INFORMATION on the full
  # sentence vs 0.999 ENTAILED on the narrow fragment, same evidence, same
  # corrected text (see outputs/research_completion_report.md §16a).
  # Never widens what counts as evidence-consistent — assertion_text is
  # always a genuine substring of the model's own corrected output. Most
  # useful paired with atomic_scope_check, since a claim only has a
  # narrower assertion_text in the first place when one of that feature's
  # split patterns applied. DEFAULT CHANGED TO "true" 2026-08-27 (was
  # "false"), paired with atomic_scope_check above. Measured on the final
  # pre-paper validation batch to produce more decisive, better-calibrated
  # re-verification signals on real corrected text (e.g. converting a
  # diluted, threshold-adjacent low-confidence NEI into a decisive
  # CONTRADICTED for a genuinely unchanged/no-op correction) without ever
  # causing an unsafe shipment — see FINAL_PRODUCTION_CONFIG.md. Set to
  # "false" to exactly reproduce every evaluation output committed before
  # 2026-08-27.
  narrow_reverification_hypothesis: true

  # ASSERTION-AWARE correction (added 2026-09-12). When True, correction
  # rewrites ONLY the flagged claim's own `assertion_text` fragment (via
  # SelectiveCorrector.correct_assertion_span()) and splices it back with a
  # deterministic string replacement (pipeline.py's
  # `_splice_assertion_correction`) instead of asking the LLM to regenerate
  # the whole paragraph. See
  # `apply_selective_correction_assertion_aware()` in pipeline.py for the
  # full design rationale, and outputs/assertion_aware_correction_*.md for
  # the controlled-benchmark and natural-data results.
  #
  # DEFAULT: false (legacy `apply_selective_correction()` — unchanged,
  # still produces every historical committed result). This is a NEW,
  # experimental mechanism evaluated alongside the legacy one for ablation
  # comparison, not yet promoted to production — per this project's rule
  # to never promote a new mechanism merely because it was implemented.
  # Set to true to use the new path; both paths share every other
  # correction.* setting above (atomic_scope_check, narrow_reverification_
  # hypothesis, etc.) except the two below, which are assertion-aware-only.
  assertion_aware: false

  # Overridable system prompt for the assertion-aware path's narrower
  # "rewrite just this fragment" instruction. Defaults to
  # pipeline.py's `_DEFAULT_ASSERTION_SPAN_SYSTEM_PROMPT` when unset here.
  assertion_span_system_prompt: >
    You are correcting one short factual fragment inside a sentence about
    an Indian statute, in the "Statutory Grounding" section of a court
    judgment summary. You will be given the case facts, the flagged
    fragment (unsupported or contradicted by the cited law), and (if
    available) the actual text of the relevant statute. Rewrite ONLY the
    fragment so it is consistent with the statute text. Do not add a
    citation, section number, or Act name that is not already present in
    the fragment you were given. Output ONLY the corrected fragment as
    plain text — no quotation marks, no surrounding sentence, no
    explanation, nothing else.

  # Much smaller than the legacy correction.max_new_tokens (220), since the
  # target is one short fragment (e.g. "fourteen years" -> "ten years"),
  # not a full paragraph.
  assertion_span_max_new_tokens: 60

modes:
  - "A"   # generation only
  - "B"   # generation + verification (diagnostic; final_field == generated_field)
  - "C"   # generation + verification + selective correction
